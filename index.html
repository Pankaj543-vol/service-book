<script>// ===== Service Book core logic (pure, no DOM) =====
var SB = (function(){
'use strict';

// ---------- dates ----------
function pd(s){ if(!s) return null; var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null; return Date.UTC(+m[1],+m[2]-1,+m[3]); }
function ds(t){ var d=new Date(t); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function addDays(s,n){ return ds(pd(s)+n*86400000); }
function addYears(s,n){ var t=new Date(pd(s)); return ds(Date.UTC(t.getUTCFullYear()+n,t.getUTCMonth(),t.getUTCDate())); }
function addMonths(s,n){ var t=new Date(pd(s)); var y=t.getUTCFullYear(), m=t.getUTCMonth()+n, d=t.getUTCDate();
  var last=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return ds(Date.UTC(y,m,Math.min(d,last))); }
function daysBetween(a,b){ return Math.round((pd(b)-pd(a))/86400000)+1; } // inclusive
function fmt(s,f){ if(!s) return ''; var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return s;
  var y=m[1], mo=m[2], d=m[3];
  switch(f){ case 'dd.mm.yyyy': return d+'.'+mo+'.'+y; case 'dd-mm-yy': return d+'-'+mo+'-'+y.slice(2);
    case 'dd/mm/yyyy': return d+'/'+mo+'/'+y; case 'dd.mm.yy': return d+'.'+mo+'.'+y.slice(2); default: return d+'-'+mo+'-'+y; } }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }

// ---------- words ----------
var ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
var ORD={one:'first',two:'second',three:'third',five:'fifth',eight:'eighth',nine:'ninth',twelve:'twelfth'};
function w99(n){ if(n<20) return ONES[n]; return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:''); }
function words(n){ if(n===0) return 'zero'; var out=[];
  if(n>=1000){ out.push(w99(Math.floor(n/1000))+' thousand'); n%=1000; }
  if(n>=100){ out.push(ONES[Math.floor(n/100)]+' hundred'); n%=100; }
  if(n>0) out.push(w99(n)); return out.join(' '); }
function ordinalWords(n){ var w=w99(n), parts=w.split(' '), last=parts.pop();
  var o=ORD[last] || (/y$/.test(last)? last.slice(0,-1)+'ieth' : last+'th'); parts.push(o); return parts.join(' '); }
function ordSuffix(n){ var j=n%10,k=n%100; if(j==1&&k!=11) return 'st'; if(j==2&&k!=12) return 'nd'; if(j==3&&k!=13) return 'rd'; return 'th'; }
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dobLine(s,src){ if(!s) return ''; var t=new Date(pd(s)), d=t.getUTCDate(), m=t.getUTCMonth(), y=t.getUTCFullYear();
  var a=d+ordSuffix(d)+' '+MONTHS[m]+' '+y;
  var b='(The '+ordinalWords(d)+' '+MONTHS[m]+' '+words(y)+(src?' as per certificate issued by '+src:'')+')';
  return a+'\n'+b; }
function superannuation(dob,age){ if(!dob) return ''; var t=new Date(pd(dob)); var y=t.getUTCFullYear()+(age||60), m=t.getUTCMonth(), d=t.getUTCDate();
  if(d===1) m=m-1; return ds(Date.UTC(y,m+1,0)); }
function money(n){ if(n==null||n==='') return ''; n=Math.round(+n); var s=String(n);
  if(s.length<=3) return s+'/-'; var last=s.slice(-3), rest=s.slice(0,-3); return rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+last+'/-'; }

// ---------- settings ----------
function genCells(entry,n,pct,rnd){ pct=+pct||3; rnd=+rnd||100; var c=[+entry]; for(var i=1;i<(n||40);i++){ c.push(Math.round(c[i-1]*(1+pct/100)/rnd)*rnd); } return c; }
function defaultDA(){ return [
  {from:'2021-01-01', pct:3, go:'78-F dt. 08.01.2021'},
  {from:'2023-03-01', pct:6, go:'850-F dt. 24.02.2023'},
  {from:'2024-01-01', pct:10, go:'56-F dt. 03.01.2024'},
  {from:'2024-04-01', pct:14, go:'1090-F dt. 01.03.2024'},
  {from:'2025-04-01', pct:18, go:''},
  {from:'2026-10-01', pct:38, go:'2834-F(P2) dt. 04/08/2026'}]; }
// pay + DA periods (separate page; does not touch service book)
function payDaRows(T,S,H){
  var da=(S.da||[]).filter(function(x){return x.from && x.pct!==''&&x.pct!=null;}).slice().sort(function(a,b){return a.from.localeCompare(b.from);});
  if(!da.length) return [];
  var pays=H.rows.filter(function(r){return r.kind==='pay' && r._pay!=null;}).map(function(r){return {d:r._date,p:r._pay};}).sort(function(a,b){return a.d.localeCompare(b.d);});
  if(!pays.length) return [];
  var today=todayStr(), start=da[0].from, posts=H.postings;
  function inService(d){ return posts.some(function(p){ return d>=p.start && (!p.end || d<=p.end); }); }
  function payOn(d){ var v=null; pays.forEach(function(x){ if(x.d<=d) v=x.p; }); return v; }
  function daOn(d){ var v=null; da.forEach(function(x){ if(x.from<=d) v=x; }); return v; }
  var b={}; pays.forEach(function(x){ if(x.d>=start) b[x.d]=1; }); da.forEach(function(x){ b[x.from]=1; });
  posts.forEach(function(p){ if(p.start>=start) b[p.start]=1; if(p.end){ b[addDays(p.end,1)]=1; } });
  var keys=Object.keys(b).filter(function(d){return d>=start && d<=today;}).sort(), out=[];
  keys.forEach(function(d,i){ if(!inService(d)) return; var p=payOn(d), x=daOn(d); if(p==null||!x) return;
    var end=keys[i+1]?addDays(keys[i+1],-1):''; posts.forEach(function(ps){ if(ps.end && d<=ps.end && (!end||ps.end<end)) end=ps.end; });
    var amt=Math.round(p*(+x.pct)/100), last=out[out.length-1];
    var isStart=posts.some(function(ps){return ps.start===d;});
    if(last && last.basic===p && last.pct===+x.pct && last.to && addDays(last.to,1)===d && !isStart){ last.to=end; return; }
    out.push({from:d, to:end, basic:p, pct:+x.pct, da:amt, total:p+amt, go:x.go||''}); });
  return out;
}
function commByName(S,n){ var L=S.commissions||[]; for(var i=0;i<L.length;i++) if(L[i].name===n) return L[i]; return null; }
function defaultCommissions(){ return [
  {name:'ROPA-2009', method:'band', factor:1.86, round:10, incPct:3, incRound:10, date:'2006-01-01', actualFrom:'2009-04-01', go:'G.O. No. 46-SE(B)/5B-1/2009 dt. 27.02.2009', note:'আগের বেসিক × 1.86, পরের ১০ টাকায় রাউন্ড = পে-ব্যান্ডের বেতন, তার সঙ্গে গ্রেড পে। ইনক্রিমেন্ট (ব্যান্ড + গ্রেড পে)-র 3%, ১০-এ রাউন্ড।'},
  {name:'ROPA-2019', method:'matrix', factor:2.57, incPct:3, cellRound:100, date:'2016-01-01', actualFrom:'2020-01-01', go:'G.O. No. 437-SE(P&B)/SL/5S-408/19 dt. 13.12.2019', note:'আগের (ব্যান্ড + গ্রেড পে) × 2.57, লেভেলের সমান বা ঠিক পরের ঘর। ইনক্রিমেন্ট = লেভেলের পরের ঘর।'},
  {name:'7th Pay Commission (WB)', method:'matrix', factor:'', incPct:3, cellRound:100, date:'2026-01-01', actualFrom:'', go:'', note:'২২.০৭.২০২৬-এ গঠিত। গুণক ও পে-ম্যাট্রিক্স এখনও ঘোষণা হয়নি — G.O. বেরোলে পূরণ করুন (PDF থেকে পড়ানো যাবে)। ইনক্রিমেন্ট এখন 3%; বদলালে এখানে বদলান।'}
]; }
function defaultSettings(){
  return {
    schoolName:'', dateFmt:'dd-mm-yyyy',
    incLabel:'Increment', notionalPrefix:'Notional ', leaveTextDefault:'No leave taken other than C.L.',
    r2009:{pct:3, roundTo:10}, commissions:defaultCommissions(), da:defaultDA(),
    inc:{month:7, day:1, minMonths:6},
    leave:{mc:15, hap:15, hapCap:60},
    pages:{part:3, finger:5, hist:8, leave:24}, lines:22,
    levels:[
      {id:'L14', commission:'ROPA-2019', name:'Level 14', pre:'PB-4 (Rs. 9000-40500) + GP Rs. 4700', cells:genCells(39900,33), note:'সরকারি অর্ডারে রেঞ্জ 39900–102800, ঘর মিলেছে'},
      {id:'L15', commission:'ROPA-2019', name:'Level 15', pre:'PB-4 (Rs. 9000-40500) + GP Rs. 4800', cells:genCells(42600,33), note:'সরকারি অর্ডারে রেঞ্জ 42600–109800, ঘর মিলেছে'},
      {id:'L10C', commission:'ROPA-2019', name:'Level 10C', pre:'PB-3 (min. Rs. 11720) + GP Rs. 4220', cells:genCells(42300,31), note:'প্রথম ১২টা ঘর 2830-F(P1) অর্ডারের সঙ্গে মিলেছে'}
    ]

}
function mergeSettings(s){ var d=defaultSettings(); if(!s) return d; for(var k in s){ if(s[k]!==undefined) d[k]=s[k]; }
  if(!d.commissions||!d.commissions.length) d.commissions=defaultCommissions();
  if(!d.da) d.da=defaultDA();
  ['r2009','inc','leave','pages'].forEach(function(k){ var dd=defaultSettings()[k]; d[k]=Object.assign({},dd,(s&&s[k])||{}); }); return d; }
function levelById(S,id){ for(var i=0;i<S.levels.length;i++) if(S.levels[i].id===id) return S.levels[i]; return null; }

// ---------- pronouns ----------
function P(T){ var f=T.sex==='F'; return {He:f?'She':'He', he:f?'she':'he', his:f?'her':'his', His:f?'Her':'His', Sri:f?'Smt.':'Sri'}; }

// ---------- event ordering ----------
var ORDER={join:0, fix2009:1, status:2, fix:3, payrow:4, inc:5, benefit:6, note:7, verify:8, resign:9, release:9};
var PAYTYPES={join:1, inc:1, fix:1, fix2009:1, benefit:1, payrow:1};
function sortEvents(ev){ return ev.slice().sort(function(a,b){ var x=(a.ord||a.date||'').localeCompare(b.ord||b.date||''); if(x) return x;
  var o=(ORDER[a.type]||0)-(ORDER[b.type]||0); if(o) return o; return (a.seq||0)-(b.seq||0); }); }

// ---------- pay chain + history rows ----------
function ceilTo(x,r){ return Math.ceil(x/r - 1e-9)*r; }
function numOrNull(v){ if(v===''||v==null) return null; var n=+String(v).replace(/[^0-9.]/g,''); return isNaN(n)?null:n; }

function computeHistory(T,S,LVM){
  LVM=LVM||{};
  var F=S.dateFmt, pr=P(T), evs=sortEvents(T.events||[]);
  var st={sys:null, pay:null, level:null, idx:-1, post:'Temporary', appt:'Temporary', posting:null, fixes:[]};
  var rows=[], flags=[], payRows=[], postings=[];
  function fd(s){ return fmt(s,F); }
  function lvl(){ return levelById(S,st.level); }
  var curDate=''; st.hist=[];
  function payOn(d){ var v=null; st.hist.forEach(function(h){ if(h.d<=d) v=h.p; }); return v; }
  function setPay(p){ st.pay=p; if(p!=null && curDate) st.hist.push({d:curDate,p:p}); if(st.sys==='matrix'){ var L=lvl(); st.idx=L?L.cells.indexOf(p):-1; } }

    if(st.sys==='2009') return st.pay+ceilTo(st.pay*(st.incPct||S.r2009.pct)/100,(st.incRound||S.r2009.roundTo));
    if(st.sys==='matrix'){ var L=lvl(); if(!L) return null; if(st.idx<0){ for(var i=0;i<L.cells.length;i++) if(L.cells[i]>st.pay) return L.cells[i]; return null; } return L.cells[st.idx+1]||null; }
    return null; }
  function notionalFor(date){ for(var i=0;i<st.fixes.length;i++){ var f=st.fixes[i]; if(f.actualFrom && date>=f.date && date<f.actualFrom) return true; } return false; }
  function resolvePay(e,expected,label){ var ov=numOrNull(e.pay); var shown=ov!=null?ov:expected;
    if(ov!=null && expected!=null && ov!==expected){ flags.push({id:e.id, date:e.date, msg:label+': বইয়ে '+ov+', হিসাবে আসে '+expected}); e._flag='হিসাবে আসে '+expected; }
    else e._flag='';
    var base=(ov!=null && e.follow!==false)? ov : (expected!=null?expected:ov);
    return {shown:shown, base:base}; }
  function postText(){ var p=st.posting; return p? (p.post+'\n'+p.school) : ''; }
  function addPayRow(e,shown,c8,c9,extra){ var r={kind:'pay', ev:e.id, c1:'', c2:'', c3:st.post, c4:st.appt, c5:fd(e.showDate||e.date), c6:money(shown), c7:'', c8:c8||'', c9:c9||'', c10:'', c11:'', c12:'',
      _date:e.date, _pay:(shown==null?null:+shown), _end:e.end||'', _isFix:e.type==='fix', posting:st.posting};
    if(extra) for(var k in extra) r[k]=extra[k]; rows.push(r); payRows.push(r); return r; }

  evs.forEach(function(e){
    e._exp=null; curDate=e.ord?'':e.date;
    var lt=e.leaveText!=null&&e.leaveText!==''? e.leaveText : S.leaveTextDefault;
    if(e.type==='join'){
      var prevPay=st.pay;
      var keepSys = st.sys && (!e.sys || (st.sys==='matrix' && (e.sys==='2009'||e.sys==='manual')));

// ---------- increments generator ----------
function genIncrements(T,S,upto){

        c7:t7?String(t7):'-', c8:t8?String(t8):'-', c9:t9?String(t9):'', c10a:o.m10a||'', c10b:o.m10b||'', c11:o.eol||'', c12a:o.s12a||'', c12b:o.s12b||'',

      Lc.push({from:s.from,to:7,lines:pw.L,box:r.box,cert:r.cert}); Rc.push({from:8,to:s.to,lines:pw.R,cert:r.cert});
    } else if(s.to<=7){ Lc.push({from:s.from,to:s.to,lines:SB.wrap(s.text,inner(W(HL,s.from-1,s.to-1)),measure),box:r.box}); }
    else { Rc.push({from:s.from,to:s.to,lines:SB.wrap(s.text,inner(W(HR,s.from-8,s.to-8)),measure)}); }
    for(var k=s.from;k<=s.to;k++) covered[k]=1;
  });
  if(r._wideR && !covered[9]){ // resignation text spans 9-12
    Rc.push({from:9,to:12,lines:SB.wrap(cells[9],inner(W(HR,1,4)),measure)}); for(var k2=9;k2<=12;k2++) covered[k2]=1; }
  for(var c2=1;c2<=12;c2++){ if(covered[c2]) continue;
    var w=c2<=7?HL[c2-1]:HR[c2-8]; var cell={from:c2,to:c2,lines:cells[c2]?SB.wrap(cells[c2],inner(w),measure):[]};
    if(c2===6||c2===5||c2===7) cell.nowrapCenter=true;
    (c2<=7?Lc:Rc).push(cell); }
  var mx=1; Lc.concat(Rc).forEach(function(x){ if(x.lines.length>mx) mx=x.lines.length; });
  Lc.sort(function(a,b){return a.from-b.from;}); Rc.sort(function(a,b){return a.from-b.from;});
  return {units:Math.max(1,Math.ceil(mx/LPR)), L:Lc, R:Rc, src:r};
}

function paginate(items,cap,carryFn){
  var pages=[], cur=[], used=0;
  items.forEach(function(it){
    if(it.units>cap){ // split long row by lines
      var parts=splitRow(it,cap); parts.forEach(function(p){ push(p); }); return; }
    push(it);
  });
  function push(it){
    if(used+it.units>cap){ pages.push(cur); cur=[]; used=0; }
    if(cur.length===0 && pages.length>0 && carryFn){ var it2=carryFn(it); if(it2){ if(it2.units>cap) it2=it; it=it2; } }
    cur.push(it); used+=it.units; }
  if(cur.length) pages.push(cur);
  if(!pages.length) pages.push([]);
  return pages;
}
function splitRow(it,cap){
  var per=cap*LPR, total=it.units*LPR, out=[];
  for(var o=0;o<total;o+=per){
    var cut=function(arr){ return arr.map(function(c){ var n=Object.assign({},c); n.lines=c.lines.slice(o,o+per); return n; }); };
    var L=cut(it.L), R=cut(it.R), mx=1; L.concat(R).forEach(function(x){ if(x.lines.length>mx) mx=x.lines.length; });
    out.push({units:Math.max(1,Math.ceil(mx/LPR)),L:L,R:R,src:it.src});
  }
  return out;
}

function colgroup(ws){ return '<colgroup>'+ws.map(function(w){return '<col style="width:'+w+'px">';}).join('')+'</colgroup>'; }
function cellsHtml(cells,base,ws,units){

}
function bodyRows(page,side,ws,cap){

  page.forEach(function(it){ h+='<tr style="height:'+(it.units*RH)+'px" class="ru">'+cellsHtml(side==='L'?it.L:it.R,0,ws,it.units)+'</tr>'; used+=it.units; });

function allPages(T,S){

<script>// ===== Offline document reader: PDF text layer + Tesseract OCR (no AI) =====
var READER=(function(){
'use strict';
function abs(p){ return new URL(p, location.href).href; }
function loadScript(src){ return new Promise(function(ok,no){ var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=function(){ no(new Error('লাইব্রেরি লোড হয়নি: '+src)); }; document.head.appendChild(s); }); }
var pdfReady=null, ocrWorker=null;
// tesseract's worker reads language data from IndexedDB (idb-keyval: db 'keyval-store', store 'keyval')
function idbPut(key,val){ return new Promise(function(ok,no){ try{ var rq=indexedDB.open('keyval-store',1);
  rq.onupgradeneeded=function(){ rq.result.createObjectStore('keyval'); };
  rq.onerror=function(){ no(new Error('এই ব্রাউজারে স্টোরেজ চালু নেই, তাই ছবি থেকে লেখা চেনা যাচ্ছে না')); };
  rq.onsuccess=function(){ var db=rq.result; var tx=db.transaction('keyval','readwrite'); tx.objectStore('keyval').put(val,key); tx.oncomplete=function(){ db.close(); ok(); }; tx.onerror=function(){ no(tx.error); }; };
 }catch(e){ no(new Error('এই ব্রাউজারে স্টোরেজ চালু নেই, তাই ছবি থেকে লেখা চেনা যাচ্ছে না')); } }); }
function ensurePdf(){ if(!pdfReady) pdfReady=loadScript(abs('vendor/pdf.min.js')).then(function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=abs('vendor/pdf.worker.min.js'); }); return pdfReady; }
function ensureOcr(progress){
  if(ocrWorker) return Promise.resolve(ocrWorker);
  return (window.Tesseract?Promise.resolve():loadScript(abs('vendor/tesseract.min.js'))).then(function(){
    progress&&progress('লেখা চেনার ফাইল লোড হচ্ছে (প্রথমবার)…');
    return fetch(abs('vendor/lang/eng.traineddata.txt')).then(function(r){ if(!r.ok) throw new Error('ভাষার ফাইল পাওয়া যায়নি'); return r.text(); }).then(function(b64){
      var bin=atob(b64.trim()), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      return idbPut('./eng.traineddata',u); }).then(function(){
      return window.Tesseract.createWorker('eng',1,{workerPath:abs('vendor/worker.min.js'), corePath:abs('vendor/core'), langPath:abs('vendor/lang'), workerBlobURL:false, cacheMethod:'readOnly',
      logger:function(m){ if(progress && m && m.status) progress('OCR: '+m.status+(m.progress?' '+Math.round(m.progress*100)+'%':'')); }}); });
  }).then(function(w){ ocrWorker=w; return w; });
}

// items: {t,x,y,w,h,page}
function fromPdf(file,progress){
  return ensurePdf().then(function(){ return file.arrayBuffer(); }).then(function(buf){
    return window.pdfjsLib.getDocument({data:buf}).promise; }).then(function(pdf){
    var out={pages:[], scanned:[]}; var i=0;
    function next(){ i++; if(i>pdf.numPages) return out; progress&&progress('পাতা '+i+'/'+pdf.numPages+' পড়ছি…');
      return pdf.getPage(i).then(function(pg){ var vp=pg.getViewport({scale:1});
        return pg.getTextContent().then(function(tc){
          var items=tc.items.filter(function(it){return it.str&&it.str.trim();}).map(function(it){ return {t:it.str, x:it.transform[4], y:vp.height-it.transform[5], w:it.width, h:Math.abs(it.transform[3])||10, page:i}; });
          var chars=items.reduce(function(s,a){return s+a.t.trim().length;},0);
          if(chars>40){ out.pages.push({page:i, items:items, src:'text'}); return next(); }
          // scanned page -> render & OCR
          var sc=2.2, v2=pg.getViewport({scale:sc}), cv=document.createElement('canvas'); cv.width=v2.width; cv.height=v2.height;
          return pg.render({canvasContext:cv.getContext('2d'), viewport:v2}).promise.then(function(){ return ocrCanvas(cv,i,progress); }).then(function(p){ p.items.forEach(function(it){ it.x/=sc; it.y/=sc; it.w/=sc; it.h/=sc; }); out.pages.push(p); out.scanned.push(i); return next(); });
        }); }); }
    return next(); });
}
function ocrCanvas(src,page,progress){
  return ensureOcr(progress).then(function(w){ progress&&progress('পাতা '+page+': লেখা চিনছি (OCR)…'); return w.recognize(src); }).then(function(r){
    var items=[]; (r.data.lines||[]).forEach(function(l){ (l.words||[]).forEach(function(wd){ if(wd.confidence<35) return; items.push({t:wd.text, x:wd.bbox.x0, y:wd.bbox.y1, w:wd.bbox.x1-wd.bbox.x0, h:wd.bbox.y1-wd.bbox.y0, page:page, conf:wd.confidence}); }); });
    return {page:page, items:items, src:'ocr', conf:r.data.confidence};
  });
}
function fromImage(file,progress){
  return new Promise(function(ok,no){ var img=new Image(); img.onload=function(){ var cv=document.createElement('canvas'); var s=Math.min(1,2600/Math.max(img.width,img.height)); cv.width=img.width*s; cv.height=img.height*s; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); ok(cv); }; img.onerror=function(){ no(new Error('ছবি খোলা যায়নি')); }; img.src=URL.createObjectURL(file); })
  .then(function(cv){ return ocrCanvas(cv,1,progress); }).then(function(p){ return {pages:[p], scanned:[1]}; });
}
function read(file,progress){ return /pdf$/i.test(file.type)||/\.pdf$/i.test(file.name) ? fromPdf(file,progress) : fromImage(file,progress); }

// ---------- lines ----------
function toLines(doc){
  var lines=[];
  doc.pages.forEach(function(p){
    var its=p.items.slice().sort(function(a,b){ return a.y-b.y || a.x-b.x; }), cur=null;
    its.forEach(function(it){ var tol=Math.max(4,(it.h||10)*0.55);
      if(cur && Math.abs(it.y-cur.y)<=tol){ cur.items.push(it); } else { cur={y:it.y,items:[it],page:p.page}; lines.push(cur); } });
  });
  lines.forEach(function(l){ l.items.sort(function(a,b){return a.x-b.x;}); l.text=l.items.map(function(i){return i.t;}).join(' ').replace(/\s+/g,' ').trim(); });
  return lines.filter(function(l){return l.text;});
}

// ---------- parsing helpers ----------
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function y4(y){ y=+y; if(y<100) y+= (y<50?2000:1900); return y; }
function iso(y,m,d){ y=y4(y); m=+m; d=+d; if(m<1||m>12||d<1||d>31||y<1950||y>2070) return null; return y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d; }
var RX_DATE=/\b(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{4}|\d{2})\b|\b(\d{1,2})(?:st|nd|rd|th)?\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[,.]?\s+(\d{4})\b/gi;
function dates(s){ var out=[], m; RX_DATE.lastIndex=0; while((m=RX_DATE.exec(s))){ var d= m[1]? iso(m[3],m[2],m[1]) : iso(m[6],MON[m[5].toLowerCase().slice(0,3)],m[4]); if(d) out.push({iso:d, raw:m[0], at:m.index}); } return out; }
function amounts(s){ var out=[], m, re=/(?:Rs\.?\s*)?\b(\d{1,3}(?:,\d{2,3})+|\d{4,6})(?:\s*\/-)?/g;
  while((m=re.exec(s))){ var raw=m[0], n=+m[1].replace(/,/g,''); var before=s.slice(Math.max(0,m.index-3),m.index);
    if(/[.\-\/]\s*$/.test(before) || /^\d{1,2}\s*[.\-\/]/.test(s.slice(m.index+m[0].length)) ) continue; // part of date
    if(n>=1950 && n<=2070 && !/Rs|,|\/-/.test(raw)) continue; // looks like a year
    if(n<1000) continue; out.push({n:n, raw:raw}); }
  return out; }
function kind(s){ s=s.toLowerCase();
  if(/ropa|revision|fixation|fixed/.test(s)) return 'fix';
  if(/10\s*y|ten year|cas\b|career advancement|benefit/.test(s)) return 'benefit';
  if(/increment|incr\b/.test(s)) return 'inc';
  if(/join|appoint/.test(s)) return 'join';
  if(/release|transfer|utsashree/.test(s)) return 'release';
  if(/resign/.test(s)) return 'resign';
  return 'inc'; }

function parse(doc){
  var lines=toLines(doc), all=lines.map(function(l){return l.text;}).join('\n');
  var R={lines:lines, text:all, info:{}, pays:[], refs:[], factor:null, levels:[], scanned:doc.scanned||[], conf:null};
  var confs=doc.pages.filter(function(p){return p.conf!=null;}).map(function(p){return p.conf;}); if(confs.length) R.conf=Math.round(confs.reduce(function(a,b){return a+b;},0)/confs.length);
  lines.forEach(function(l,ix){ var t=l.text, low=t.toLowerCase();
    var mName=/\bname\b[^A-Za-z]{0,6}([A-Z][A-Za-z.]+(?:\s+[A-Z][A-Za-z.]+){1,4})/.exec(t); if(mName && !R.info.name && !/father|husband|school|institution|post/i.test(t.slice(0,mName.index))) R.info.name=mName[1].trim();
    if(/birth/i.test(t)){ var dd=dates(t); if(dd.length && !R.info.dob) R.info.dob=dd[0].iso; }
    var mF=/father'?s?(?:\/husband'?s?)?\s*name[^A-Za-z]{0,8}([A-Z][A-Za-z.]+(?:\s+[A-Z][A-Za-z.]+){0,4})/i.exec(t); if(mF && !R.info.father) R.info.father=mF[1].trim();
    var mH=/height[^0-9]{0,20}(\d{2,3}\s*(?:c\.?\s*m|cm))/i.exec(t); if(mH && !R.info.height) R.info.height=mH[1].replace(/\s+/g,' ').toUpperCase();
    // pay rows: a line with a date and an amount
    var ds=dates(t), am=amounts(t);
    var mp=/\bpay\b[^0-9]{0,12}(\d{1,3}(?:,\d{2,3})+|\d{4,6})/i.exec(t); var payN=mp?+mp[1].replace(/,/g,''):(am.length?am[am.length-1].n:0);
    if(ds.length && payN){ R.pays.push({date:ds[0].iso, end:ds[1]?ds[1].iso:'', pay:payN, kind:kind(t), line:t, page:l.page}); }
    // references
    var re=/\b(G\.?\s*O\.?|Memo\.?|Notification|Resolution)\s*(?:No\.?)?\s*[:\-]?\s*([A-Za-z0-9()\/\-.&]+(?:\s*\([A-Za-z0-9]+\))?(?:[\/\-][A-Za-z0-9()\/\-.&]+)*)[^\n]{0,40}?(?:dt\.?|dated|date)\s*[:\-]?\s*(\d{1,2}\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{2,4}|\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]+,?\s+\d{4})/gi, m;
    while((m=re.exec(t))){ var dd2=dates(m[3]); R.refs.push({kind:m[1].replace(/\s/g,''), no:m[2], date:dd2.length?dd2[0].iso:'', text:(m[1].replace(/\s+/g,'')+' No. '+m[2]+' dt. '+m[3]).replace(/\s+/g,' ')}); }
    if(!/(G\.?\s*O\.?|Memo|Notification|Resolution)\s*(No)?/i.test(t)){ var mno=/\bNo\.?\s*[:\-]?\s*([A-Za-z0-9()\/\-.&]*\d[A-Za-z0-9()\/\-.&]*)\s*,?\s*(?:dt\.?|dated|date)\s*[:\-]?\s*(\d{1,2}\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{2,4})/i.exec(t);
      if(mno){ var dd3=dates(mno[2]); R.refs.push({kind:'No', no:mno[1], date:dd3.length?dd3[0].iso:'', text:(mno[1]+' dt. '+mno[2]).replace(/\s+/g,' ')}); } }
    var mfac=/(?:factor|multipl\w*)\D{0,25}?(\d\.\d{1,3})\b/i.exec(t); if(mfac && !R.factor) R.factor=+mfac[1];
  });
  // de-duplicate pays by date
  var seen={}; R.pays=R.pays.filter(function(p){ var k=p.date+'|'+p.pay; if(seen[k]) return false; seen[k]=1; return true; });
  R.levels=matrixCols(doc);
  return R;
}
// pay-matrix columns: numeric items grouped by x, increasing ~2-6% down the column
function matrixCols(doc){
  var out=[];
  doc.pages.forEach(function(p){
    var nums=p.items.map(function(it){ var s=it.t.replace(/[,\s]/g,''); return /^\d{4,6}$/.test(s)?{n:+s,x:it.x+it.w/2,y:it.y}:null; }).filter(Boolean).filter(function(o){return o.n>=5000&&o.n<=400000;});
    var cols=[]; nums.forEach(function(o){ var c=null; for(var i=0;i<cols.length;i++) if(Math.abs(cols[i].x-o.x)<14){ c=cols[i]; break; } if(!c){ c={x:o.x,v:[]}; cols.push(c); } c.v.push(o); });
    cols.forEach(function(c){ c.v.sort(function(a,b){return a.y-b.y;}); var seq=[]; c.v.forEach(function(o){ var last=seq[seq.length-1]; if(!last || (o.n/last>1.015 && o.n/last<1.07)) seq.push(o.n); else if(seq.length<5) seq=[o.n]; });
      if(seq.length>=5){ var nm='', best=1e9; var top=c.v[0].y; p.items.forEach(function(it){ var m=/Level\s*[-:]?\s*(\d{1,2}[A-Z]?)/i.exec(it.t); if(m && it.y<top){ var dx=Math.abs(it.x+it.w/2-c.x), dy=top-it.y; if(dx<60 && dx+dy<best){ best=dx+dy; nm='Level '+m[1]; } } });
        out.push({page:p.page, cells:seq, name:nm}); } });
  });
  return out;
}
return {ensurePdf:ensurePdf, read:read, parse:parse, dates:dates, amounts:amounts, toLines:toLines};
})();
