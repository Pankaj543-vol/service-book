<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>সার্ভিস বুক</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Serif:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:#f3f1ec;color:#1d1d1d;font-size:15px}
header.top{position:sticky;top:0;z-index:5;background:#1f3b73;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
header .tl{display:flex;align-items:center;gap:8px;min-width:0}header .sch{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;opacity:.85;white-space:nowrap}.ib{background:none;border:0;color:inherit;font-size:20px;padding:2px 6px;cursor:pointer}
.pad{padding:12px;max-width:860px;margin:0 auto}.muted{color:#666}.sm{font-size:13px;margin:8px 0}
.warn{background:#fff3cd;color:#6b4e00;padding:8px 12px;font-size:13px}
.btn{border:1px solid #b9b4a8;background:#fff;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:#1d1d1d}
.btn.pri{background:#1f3b73;border-color:#1f3b73;color:#fff}.btn.danger{color:#a3221b;border-color:#e2b4b0}.btn.sm2{padding:6px 10px;font-size:13px}.btn.block{display:block;width:100%;text-align:left;margin:6px 0}
.row{display:flex}.gap{gap:8px}.wrap{flex-wrap:wrap}
.card{background:#fff;border:1px solid #e1ddd3;border-radius:10px;padding:12px;margin:10px 0}
.tcard{cursor:pointer;position:relative}.tcard .tdel{position:absolute;right:10px;top:10px}.tn{font-weight:700;font-size:16px}
.empty{padding:24px;text-align:center;color:#777;background:#fff;border:1px dashed #ccc;border-radius:10px;margin:12px 0}
.flag{color:#a3221b;font-size:13px;margin:4px 0}.flagbox{background:#fdecea;border:1px solid #f1b6b1;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#7a1b15}.flagbox ul{margin:6px 0 0;padding-left:18px}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:44px;z-index:4}
.tab{flex:1 0 auto;border:0;background:none;padding:11px 12px;font:inherit;font-size:14px;color:#555;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}.tab.on{color:#1f3b73;border-bottom-color:#1f3b73;font-weight:700}
.form .f{display:block;margin:10px 0}.form .f>span{display:block;font-size:13px;color:#444;margin-bottom:4px}
.form input,.form textarea,.form select,.lf input{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #cfc9bc;border-radius:8px;background:#fff}
.form textarea{font-family:"Roboto Condensed",Arial,sans-serif}.form small{display:block;color:#777;font-size:12px;margin-top:3px}
.prev{background:#f7f5ef;border:1px solid #e6e1d4;border-radius:8px;padding:10px;margin:12px 0;font-size:13px}
.prev pre,.evt{font-family:"Roboto Condensed",Arial,sans-serif;color:#1b3a9a;white-space:pre-wrap;margin:6px 0 0;font-size:13.5px;line-height:1.35}
.ev .evh,.lcard .evh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.ed{font-weight:700}.et{color:#555;font-size:13px}.ep{margin-left:auto;font-weight:700;color:#1b3a9a}
.evt{margin:6px 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}@media(min-width:600px){.lgrid{grid-template-columns:repeat(4,1fr)}}
.lf span{display:block;font-size:12px;color:#555;margin-bottom:2px}.lf input{padding:7px 8px}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end;justify-content:center}#dlg.on{display:flex}
.dlgbox{background:#fff;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0}.dlgbox.small{max-width:420px;border-radius:14px;margin-bottom:30vh}
@media(min-width:700px){#dlg{align-items:center}.dlgbox{border-radius:14px}}
.dlgh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #eee}.dlgb{padding:6px 14px;overflow:auto}.dlgf{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid #eee}
h3{margin:22px 0 4px}h4{margin:14px 0 6px}.okbox{background:#e8f5e9;border:1px solid #b7dfbb;border-radius:10px;padding:10px 12px;font-size:13px;color:#1f5e25;margin-bottom:10px}.chk{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}.chk input[type=checkbox]{width:20px;height:20px}.imv{flex:1;min-width:140px;font:inherit;padding:7px 8px;border:1px solid #cfc9bc;border-radius:8px}.chk small{width:100%;padding-left:28px;color:#777}.imrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;align-items:center;margin:8px 0;border-bottom:1px dashed #e3ded2;padding-bottom:6px}.imrow input,.imrow select{font:inherit;font-size:14px;padding:6px;border:1px solid #cfc9bc;border-radius:6px;min-width:0}.imrow small{grid-column:1/-1;font-size:11.5px}.dabig{font-size:16px;margin-top:4px}.tw{overflow-x:auto}.dat{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}.dat th,.dat td{border:1px solid #e1ddd3;padding:7px 6px;text-align:right;white-space:nowrap}.dat th{background:#f7f5ef;text-align:center}.darow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.darow .f:nth-child(3){grid-column:1/-1}.todobox{background:#fff8e1;border:1px solid #f0d58a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;color:#5a4300}.todobox ul{margin:6px 0 0;padding-left:18px}.todobox li{margin:6px 0}.imsch{grid-column:2/-1;font:inherit;font-size:14px;padding:6px;border:1px solid #e0b94d;border-radius:6px;background:#fffdf3}details{margin:12px 0}summary{cursor:pointer;color:#1f3b73}
#pagesWrap{margin-top:10px}.pfit{overflow:hidden;margin:0 auto 12px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}#toast.on{opacity:1}
</style></head><body><div id="app"></div><div id="dlg"></div><div id="toast"></div>
